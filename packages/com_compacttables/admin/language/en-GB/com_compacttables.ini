COM_COMPACTTABLES_HELP_LINK_TITLE="Linking tables"
COM_COMPACTTABLES_HELP_LINK_BODY="When several tables are below each other in an article, each table decides the width of its own columns, so they do not line up. On the Style tab, open the list under ‘Link Tables’ and tick the tables that belong with this one. On the website the table that needs the most room decides the width of each column, and all linked tables get exactly the same column widths. A link works both ways: the linked tables show the tick too. Linking a table that was already linked to other tables takes it out of that group. In the overview, the column ‘Linked’ shows which tables a table is linked to. This works for tables with the same number of columns; the number of columns is shown after every name in the list. Tables that ‘Scroll sideways’ on small screens keep their own widths, and when rows are stacked on a phone there are no columns left to line up. ‘Save as Copy’ makes a copy without links. The preview on the Style tab shows one table and therefore no linking."
