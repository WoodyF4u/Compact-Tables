COM_COMPACTTABLES_TB_LINK="Insert Link"
COM_COMPACTTABLES_TB_REMOVEFORMAT="Remove Formatting"
COM_COMPACTTABLES_TB_SEPARATOR="Separator line"
COM_COMPACTTABLES_CONFIG_TOOLBAR_LABEL="Editor Bar"
COM_COMPACTTABLES_CONFIG_TOOLBAR_DESC="Choose which buttons the bar above the table has when a table is edited, and in which order."
COM_COMPACTTABLES_CONFIG_TOOLBAR_FIELD_LABEL="Buttons of the editor bar"
COM_COMPACTTABLES_TBCONF_CURRENT="Current layout of the editor bar"
COM_COMPACTTABLES_TBCONF_AVAILABLE="Available buttons"
COM_COMPACTTABLES_TBCONF_HINT="Drag a button to where you want it, or back to the available buttons to take it out. Clicking a button moves it to the other list. With the keyboard: Enter moves the button, the left and right arrow keys shift it. A thin vertical line in the current layout is a separator between two groups of buttons; you can add as many as you like with ‘Separator line’ under the available buttons."
COM_COMPACTTABLES_TBCONF_RESET="Restore Default Layout"
COM_COMPACTTABLES_HELP_TOOLBAR_TITLE="The editor bar"
COM_COMPACTTABLES_HELP_TOOLBAR_BODY="The bar above the table formats the text in a cell: bold, italic, underline and, if switched on, strikethrough, subscript and superscript. Put the cursor in a cell or select text, then click a button; a button is coloured while the text at the cursor has that formatting. The button with the crossed-out T removes the formatting of the selected text. Hold the mouse over a button to see its name."
COM_COMPACTTABLES_HELP_TBCONF_TITLE="Options: Editor Bar"
COM_COMPACTTABLES_HELP_TBCONF_BODY="On the Editor Bar tab under Options you choose which buttons the editor bar has and in which order. Drag buttons between ‘Current layout’ and ‘Available buttons’, or click them. The layout applies to everyone who edits tables. Restore Default Layout brings back the original bar."
COM_COMPACTTABLES_MODAL_NEW="Make a new table"
COM_COMPACTTABLES_MODAL_DELETE_FAILED="The table could not be deleted."

; Editor inside the picker dialog
COM_COMPACTTABLES_EMBEDDED_NEW="New table"
COM_COMPACTTABLES_EMBEDDED_EDIT="Edit table"
COM_COMPACTTABLES_EMBEDDED_SAVE_BACK="Save & back to the list"
COM_COMPACTTABLES_EMBEDDED_SAVE="Save"
COM_COMPACTTABLES_EMBEDDED_BACK="Back without saving"
COM_COMPACTTABLES_TABLE_SUBMIT_SAVE_SUCCESS="Table saved."
COM_COMPACTTABLES_FIELDSET_LAYOUT="Width, Alignment and Spacing"
COM_COMPACTTABLES_FIELD_WIDTH_LABEL="Width of the Table"
COM_COMPACTTABLES_FIELD_WIDTH_DESC="Empty = the full width. Choose % for a part of the available space, or px for a fixed maximum width. Applies to wide screens; on tablets and phones the table always uses the full width."
COM_COMPACTTABLES_FIELD_WIDTH_HINT="Full width"
COM_COMPACTTABLES_FIELD_ALIGN_LABEL="Alignment on the Page"
COM_COMPACTTABLES_FIELD_ALIGN_DESC="Only has an effect when the table is narrower than the full width."
COM_COMPACTTABLES_OPTION_ALIGN_LEFT="Left"
COM_COMPACTTABLES_OPTION_ALIGN_CENTER="Centre"
COM_COMPACTTABLES_OPTION_ALIGN_RIGHT="Right"
COM_COMPACTTABLES_HELP_WIDTH_TITLE="Width, alignment and spacing"
COM_COMPACTTABLES_HELP_WIDTH_BODY="By default a table uses the full width of the article. Enter a number under ‘Width of the Table’ to make it narrower: in % (a part of the available space, for example 60%) or in px (a fixed maximum width, for example 600px). A width in px never becomes wider than the space there is. ‘Alignment on the Page’ puts the narrower table on the left, in the centre or on the right. On tablets and phones (screens up to 768 pixels wide) the table always uses the full width."
COM_COMPACTTABLES_EDITOR_LINK_TEL="Link to Phone Number"
COM_COMPACTTABLES_EDITOR_LINK_EMAIL="Link to Email Address"
COM_COMPACTTABLES_EDITOR_TEL_LABEL="Phone number"
COM_COMPACTTABLES_EDITOR_TEL_INVALID="Enter a phone number such as 020 123 45 67 or +31 6 12345678."
COM_COMPACTTABLES_EDITOR_EMAIL_LABEL="Email address"
COM_COMPACTTABLES_EDITOR_EMAIL_INVALID="Enter an email address such as name@example.org."
COM_COMPACTTABLES_FIELDSET_BODY="Other Cells"
COM_COMPACTTABLES_FIELDSET_BODY_DESC="All rows below the top row. If the table has no row with column titles, these settings apply to all cells."
COM_COMPACTTABLES_FIELD_HOVER_LABEL="Highlight Row Under the Mouse"
COM_COMPACTTABLES_FIELD_HOVER_DESC="The row the mouse is over gets a light background colour. Helps when reading wide tables. Not for the top row and not on touch screens."
COM_COMPACTTABLES_FIELD_HOVER_COLOR_LABEL="Highlight Colour"
COM_COMPACTTABLES_FIELD_HOVER_COLOR_DESC="Empty = the text colour, so it suits light and dark display alike."
COM_COMPACTTABLES_FIELD_HOVER_STRENGTH_LABEL="Intensity"
COM_COMPACTTABLES_FIELD_HOVER_STRENGTH_DESC="How strongly the colour shows: 1% is barely visible, 100% is the full colour. Empty = 8%; between 5% and 15% the text stays easy to read."
COM_COMPACTTABLES_FIELD_HOVER_STRENGTH_HINT="8"
COM_COMPACTTABLES_HELP_HOVER_TITLE="Style: highlight row under the mouse"
COM_COMPACTTABLES_HELP_HOVER_BODY="Under ‘Other Cells’ set ‘Highlight Row Under the Mouse’ to Yes. The row the mouse is over then gets a background colour. Choose the colour (empty = the text colour) and the intensity in percent (empty = 8%). The top row does not light up, and nothing happens on phones and tablets without a mouse."
COM_COMPACTTABLES_FIELD_LINK_COLOR_LABEL="Link Colour"
COM_COMPACTTABLES_HELP_BODY_TITLE="Other cells"
COM_COMPACTTABLES_HELP_BODY_BODY="Text colour, bold text, font size and link colour of all rows below the top row. If the table has no row with column titles, these settings apply to all cells. Text you made bold inside a cell stays bold."
COM_COMPACTTABLES_FIELD_VLINE_WIDTH_LABEL="Vertical Lines Between Cells: Thickness"
COM_COMPACTTABLES_FIELD_VLINE_COLOR_LABEL="Vertical Lines Between Cells: Colour"
COM_COMPACTTABLES_FIELD_HLINE_WIDTH_LABEL="Horizontal Lines Between Cells: Thickness"
COM_COMPACTTABLES_FIELD_HLINE_COLOR_LABEL="Horizontal Lines Between Cells: Colour"
COM_COMPACTTABLES_FIELD_HEAD_LINE_WIDTH_LABEL="Line Below the Top Row: Thickness"
COM_COMPACTTABLES_FIELD_HEAD_LINE_COLOR_LABEL="Line Below the Top Row: Colour"
COM_COMPACTTABLES_FIELD_SPACING_LABEL="Room Between the Cells"
COM_COMPACTTABLES_FIELD_SPACING_DESC="Empty = no room; the cells touch. In px, rem or em."
COM_COMPACTTABLES_FIELD_SPACING_HINT="None"
COM_COMPACTTABLES_HELP_SPACING_TITLE="Room between the cells"
COM_COMPACTTABLES_HELP_SPACING_BODY="Sets the cells apart, with the given room between them (in px, rem or em). Every cell then has its own background and lines; the background of the page shows in the gaps. Leave the field empty for an ordinary, closed table."

; Text in the cells
COM_COMPACTTABLES_FIELDSET_CELLS="Text in the Cells"
COM_COMPACTTABLES_FIELD_CELL_ALIGN_LABEL="Horizontal Alignment"
COM_COMPACTTABLES_FIELD_CELL_VALIGN_LABEL="Vertical Alignment"
COM_COMPACTTABLES_FIELD_LINE_HEIGHT_LABEL="Line Height"
COM_COMPACTTABLES_FIELD_LINE_HEIGHT_DESC="Space between the lines of text in a cell. Template default = the same as the rest of the text on your site."
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_1="1 (very tight)"
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_115="1.15 (like a text document)"
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_125="1.25"
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_15="1.5"
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_175="1.75"
COM_COMPACTTABLES_OPTION_LINE_HEIGHT_2="2 (double)"
COM_COMPACTTABLES_FIELD_CELL_PADDING_LABEL="Room Inside the Cell"
COM_COMPACTTABLES_FIELD_CELL_PADDING_DESC="Room between the text and the edge of the cell, on all four sides. Empty = template default, 0 = no room. In px, rem or em."
COM_COMPACTTABLES_FIELD_CELL_PADDING_HINT="Template"
COM_COMPACTTABLES_HELP_CELL_TEXT_TITLE="Style: line height and room inside the cell"
COM_COMPACTTABLES_HELP_CELL_TEXT_BODY="Under ‘Text in the Cells’ you set the line height (for example 1.15 for lines as close together as in a text document) and the room between the text and the edge of the cell, such as <code>4px</code> or <code>0.25rem</code>. Empty or Template default leaves both to your template. Both apply to all cells, including the top row."
COM_COMPACTTABLES_OPTION_VALIGN_TOP="Top"
COM_COMPACTTABLES_OPTION_VALIGN_MIDDLE="Middle"
COM_COMPACTTABLES_OPTION_VALIGN_BOTTOM="Bottom"
COM_COMPACTTABLES_HELP_CELLALIGN_TITLE="Text in the cells"
COM_COMPACTTABLES_HELP_CELLALIGN_BODY="By default the text in every cell is on the left and at the top, the top row included. Under ‘Horizontal Alignment’ choose left, centre or right, under ‘Vertical Alignment’ top, middle or bottom. Choose ‘Template default’ to leave it to your site template; Cassiopeia, for example, then puts the text in the vertical middle."

; Linked tables
COM_COMPACTTABLES_FIELDSET_LINK="Link Tables"
COM_COMPACTTABLES_FIELD_LINKED_DESC="When one article shows several tables with the same number of columns, and the columns should be equally wide in every table, link these tables to each other."
