COM_COMPACTTABLES_CONFIG_TABLE_CLASS_LABEL="Extra CSS Class for Tables"
COM_COMPACTTABLES_CONFIG_TABLE_CLASS_HINT="Empty = template styling"
COM_COMPACTTABLES_CONFIG_TABLE_CLASS_DESC="Leave this empty (recommended): every table then gets exactly the styling your template gives ordinary tables, the same as a table you insert into an article with JCE or TinyMCE. Only fill this in if you deliberately want a different look for all Compact Tables tables. With Bootstrap templates such as Cassiopeia, for example: 'table' for Bootstrap table styling (more space in the cells, lines between the rows and its own styling of the top row), 'table table-striped' for alternating row colours, 'table table-bordered' for lines around every cell or 'table table-hover' for a highlighted row under the mouse. Your own CSS classes work too. Note: these tables will then look different from the ordinary tables on your site. Separate multiple classes with a space."

