; Help page
COM_COMPACTTABLES_HELP_TITLE="Compact Tables - Help"
COM_COMPACTTABLES_HELP_BACK="Back to Overview"
COM_COMPACTTABLES_HELP_ABOUT_TITLE="About Compact Tables"
COM_COMPACTTABLES_HELP_ABOUT_BODY="With Compact Tables you make tables that adapt to the width of the screen. You make a table here in the administrator and show it in an article with a short code, for example <code>{table 1}</code>. When you change the table later, it changes everywhere the code is used."
COM_COMPACTTABLES_HELP_SECTION_MAKE="Making a table"
COM_COMPACTTABLES_HELP_SECTION_CSS="The Style tab"
COM_COMPACTTABLES_HELP_SECTION_USE="Using a table"
COM_COMPACTTABLES_HELP_SECTION_SETTINGS="Options and permissions"
COM_COMPACTTABLES_HELP_NEW_TITLE="A new table"
COM_COMPACTTABLES_HELP_NEW_BODY="Click the plus sign (or New). Fill in the table and click Save. The table then appears in the overview, followed by a pencil to edit it and a bin to delete it."
COM_COMPACTTABLES_HELP_NAME_TITLE="Name of the table"
COM_COMPACTTABLES_HELP_NAME_BODY="Only for yourself, to find the table again in the overview and in the editor button. Visitors of the website do not see the name."
COM_COMPACTTABLES_HELP_SIZE_TITLE="Number of columns and rows"
COM_COMPACTTABLES_HELP_SIZE_BODY="A new table starts with three columns and three rows. Use the plus signs to the right of and below the table to add columns and rows, and the bins to remove them. An HTML table has no technical maximum: the 12 of Bootstrap is about the layout of a page, not about tables. Compact Tables stops at %1$d columns and %2$d rows, only to keep this edit screen fast. Remember that many columns become narrow on a phone; see ‘Small screens’ below."
COM_COMPACTTABLES_HELP_HEADER_TITLE="Top row contains column titles"
COM_COMPACTTABLES_HELP_HEADER_BODY="On: the top row is shown as the heading of the table, and search engines and screen readers know these are the titles of the columns. Off: the top row is an ordinary row."
COM_COMPACTTABLES_HELP_CELLS_TITLE="Filling cells"
COM_COMPACTTABLES_HELP_CELLS_BODY="Click in a cell and type. Enter starts a new line inside the cell, Tab goes to the next cell. Text you paste comes in without its formatting. A word that is too long for its cell breaks onto the next line on the website."
COM_COMPACTTABLES_HELP_ROWSCOLS_TITLE="Adding and deleting rows and columns"
COM_COMPACTTABLES_HELP_ROWSCOLS_BODY="The plus sign below the last row adds a row; the plus sign to the right of the table adds a column. The bin in front of a row deletes that row, the bin above a column deletes that column. If there is text in it, you are asked to confirm first. A table always keeps at least one row and one column."
COM_COMPACTTABLES_HELP_MOVE_TITLE="Moving rows"
COM_COMPACTTABLES_HELP_MOVE_BODY="Drag a row up or down by the symbol with the two arrows in front of it. With the keyboard: put the focus on that symbol and press the up or down arrow key. Columns cannot be moved."
COM_COMPACTTABLES_HELP_LINKS_TITLE="Links in a cell"
COM_COMPACTTABLES_HELP_LINKS_BODY="Select text in a cell and click the link button (the chain) in the bar above the table. Choose Link to Menu Item, Link to Article, Link to Web Address, Link to Phone Number or Link to Email Address. You pick a menu item or article from a list. For a web address you can choose to open the link in a new window. Type a phone number the way you are used to (spaces or dashes are fine); whoever taps it on a phone can call straight away. An email address becomes a link that opens the visitor’s mail program. If the selected text is a number or address itself, it is filled in for you. To remove a link, put the cursor in it and click the button with the broken chain. While the cursor is in a link, the bar shows where it goes to."
COM_COMPACTTABLES_HELP_TEMPLATE_TITLE="Template default"
COM_COMPACTTABLES_HELP_TEMPLATE_BODY="Everything you leave empty follows your site template: the table then looks the way your template styles tables. The cross behind a colour puts it back to the template default."
COM_COMPACTTABLES_HELP_TOPROW_TITLE="Top row"
COM_COMPACTTABLES_HELP_TOPROW_BODY="Background colour, text colour, bold text, font size (in px, rem, em or %) and link colour of the top row. These settings only do something when ‘Top Row Contains Column Titles’ is on. If you choose a text colour but no link colour, links in the top row take that text colour. ‘Bold Text’ is set to Yes for a new table. Templates differ here: T4 makes column titles bold, Cassiopeia gives them a weight of 500, so they hardly look bold. With Yes or No they look the same on every template."
COM_COMPACTTABLES_HELP_LINES_TITLE="Borders"
COM_COMPACTTABLES_HELP_LINES_BODY="‘Outer border of the table’ is the border around the whole table. ‘Vertical lines between cells’ are between the columns, ‘Horizontal lines between cells’ between the rows; you set them separately, so you can show lines between the rows only, for example. ‘Line below the top row’ only appears when ‘Top Row Contains Column Titles’ is on, and gives the border under the column titles its own thickness and colour. Every line has a thickness in pixels and a colour. If you only enter a thickness, the line takes the colour of the text; if you only choose a colour, the line is 1 pixel. A thickness of 0 removes the line, also when your template shows one."
COM_COMPACTTABLES_HELP_SMALL_TITLE="Small screens"
COM_COMPACTTABLES_HELP_SMALL_BODY="What happens when the screen is too narrow for the table. ‘Keep columns’: all columns stay next to each other, equally wide, and text wraps. ‘Scroll sideways’: the table keeps its width and the visitor swipes it sideways. ‘Stack rows’: every row is shown as a block, with the column title in front of each value. With many columns, the last two usually read best on a phone."
COM_COMPACTTABLES_HELP_PREVIEW_TITLE="Preview"
COM_COMPACTTABLES_HELP_PREVIEW_BODY="Shows your colours, borders, width, alignment and room between the cells straight away. With Wide and Phone you see how the table behaves on a large and on a small screen. Fonts, and everything left on the template default, follow your site template on the website and can differ from the preview."
COM_COMPACTTABLES_HELP_CODE_TITLE="The code in an article"
COM_COMPACTTABLES_HELP_CODE_BODY="Type the code of the table, for example <code>{table 1}</code>, in an article at the place where the table should appear, preferably on a line of its own. The number is shown behind each table in the overview, with a button to copy the code. The same table can be used in several articles."
COM_COMPACTTABLES_HELP_BUTTON_TITLE="The editor button"
COM_COMPACTTABLES_HELP_BUTTON_BODY="When editing an article you do not have to type the code: use the Compact Tables button and choose the table from the list. In TinyMCE the button is in the CMS Content menu of the toolbar, in JCE with the buttons below the editor. It works in the administrator and when editing on the website. Depending on your permissions the list also lets you make a new table, edit a table (the pencil) and delete one (the bin). Making and editing happens in the same pop-up; after saving you are back at the list and can choose the table."
COM_COMPACTTABLES_HELP_DELETE_TITLE="Deleting a table"
COM_COMPACTTABLES_HELP_DELETE_BODY="The bin in the overview deletes a table for good, after you confirm. Articles that still contain its code show nothing at that place."
COM_COMPACTTABLES_HELP_OPTIONS_TITLE="Options: extra CSS class for tables"
COM_COMPACTTABLES_HELP_OPTIONS_BODY="This field is empty by default. A table then gets the styling your template gives ordinary tables, including the top row (<code>thead</code> and <code>th</code>), so Compact Tables tables look the same as tables you insert with the editor. Whatever you enter here is added to every Compact Tables table. With Bootstrap templates such as Cassiopeia, <code>table</code> gives Bootstrap table styling; you can add <code>table-striped</code> (alternating row colours), <code>table-bordered</code> (lines around every cell) or <code>table-hover</code> (highlighted row under the mouse), for example <code>table table-striped</code>. Whatever you set per table on the Style tab always comes on top of that."
COM_COMPACTTABLES_HELP_PERMISSIONS_TITLE="Permissions"
COM_COMPACTTABLES_HELP_PERMISSIONS_BODY="On the Permissions tab under Options you decide per user group who may make (Create), change (Edit) and delete (Delete) tables. These permissions apply in the administrator and on the website alike. With Joomla’s default permissions, authors may make tables, editors may also change them, and managers may also delete them. The editor button itself is available in the administrator to everyone with access to Compact Tables, and on the website to everyone who may write or edit articles."
COM_COMPACTTABLES_HELP_SAVE_TITLE="Saving"
COM_COMPACTTABLES_HELP_SAVE_BODY="Save keeps you on this screen, Save &amp; Close goes back to the overview. Under the arrow next to it: Save &amp; New starts an empty table straight away, and Save as Copy stores the table you have open as a new table with its own code, leaving the original as it was. The copy gets a number behind its name unless you change the name first."

; Editor bar
COM_COMPACTTABLES_TB_LABEL="Editor bar"
COM_COMPACTTABLES_TB_BOLD="Bold"
COM_COMPACTTABLES_TB_ITALIC="Italic"
COM_COMPACTTABLES_TB_UNDERLINE="Underline"
COM_COMPACTTABLES_TB_STRIKETHROUGH="Strikethrough"
