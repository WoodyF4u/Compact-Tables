; Helppagina
COM_COMPACTTABLES_HELP_TITLE="Compact Tabellen - Help"
COM_COMPACTTABLES_HELP_BACK="Terug naar overzicht"
COM_COMPACTTABLES_HELP_ABOUT_TITLE="Over Compact Tabellen"
COM_COMPACTTABLES_HELP_ABOUT_BODY="Met Compact Tabellen maak je tabellen die zich aanpassen aan de breedte van het scherm. Je maakt een tabel hier in het beheer en toont hem in een artikel met een korte code, bijvoorbeeld <code>{table 1}</code>. Pas je de tabel later aan, dan verandert hij overal waar de code staat."
COM_COMPACTTABLES_HELP_SECTION_MAKE="Een tabel maken"
COM_COMPACTTABLES_HELP_SECTION_CSS="Het tabblad Stijl"
COM_COMPACTTABLES_HELP_SECTION_USE="Een tabel gebruiken"
COM_COMPACTTABLES_HELP_SECTION_SETTINGS="Opties en rechten"
COM_COMPACTTABLES_HELP_NEW_TITLE="Een nieuwe tabel"
COM_COMPACTTABLES_HELP_NEW_BODY="Klik op het plusteken (of op Nieuw). Vul de tabel in en klik op Opslaan. De tabel staat daarna in het overzicht, met erachter een potloodje om hem te bewerken en een vuilnisbakje om hem te verwijderen."
COM_COMPACTTABLES_HELP_NAME_TITLE="Naam van de tabel"
COM_COMPACTTABLES_HELP_NAME_BODY="Alleen voor jezelf, om de tabel terug te vinden in het overzicht en in de editorknop. Bezoekers van de website zien de naam niet."
COM_COMPACTTABLES_HELP_SIZE_TITLE="Aantal kolommen en rijen"
COM_COMPACTTABLES_HELP_SIZE_BODY="Een nieuwe tabel begint met drie kolommen en drie rijen. Met de plustekens rechts van en onder de tabel voeg je kolommen en rijen toe, met de vuilnisbakjes haal je ze weg. Een HTML-tabel heeft technisch geen maximum: de 12 van Bootstrap gaat over de indeling van een pagina, niet over tabellen. Compact Tabellen stopt bij %1$d kolommen en %2$d rijen, alleen om dit bewerkscherm snel te houden. Bedenk dat veel kolommen op een telefoon smal worden; zie ‘Kleine schermen’ hieronder."
COM_COMPACTTABLES_HELP_HEADER_TITLE="Bovenste rij bevat kolomtitels"
COM_COMPACTTABLES_HELP_HEADER_BODY="Aan: de bovenste rij wordt als kop van de tabel getoond, en zoekmachines en schermlezers weten dat dit de titels van de kolommen zijn. Uit: de bovenste rij is een gewone rij."
COM_COMPACTTABLES_HELP_CELLS_TITLE="Cellen vullen"
COM_COMPACTTABLES_HELP_CELLS_BODY="Klik in een cel en typ. Enter begint een nieuwe regel binnen de cel, Tab gaat naar de volgende cel. Tekst die je plakt, komt zonder opmaak binnen. Een woord dat te lang is voor zijn cel, breekt op de website af naar de volgende regel."
COM_COMPACTTABLES_HELP_ROWSCOLS_TITLE="Rijen en kolommen toevoegen en verwijderen"
COM_COMPACTTABLES_HELP_ROWSCOLS_BODY="Het plusteken onder de laatste rij voegt een rij toe; het plusteken rechts van de tabel voegt een kolom toe. Het vuilnisbakje vóór een rij verwijdert die rij, het vuilnisbakje boven een kolom verwijdert die kolom. Staat er tekst in, dan wordt eerst om bevestiging gevraagd. Een tabel houdt altijd minstens één rij en één kolom."
COM_COMPACTTABLES_HELP_MOVE_TITLE="Rijen verplaatsen"
COM_COMPACTTABLES_HELP_MOVE_BODY="Sleep een rij omhoog of omlaag aan het symbool met de twee pijltjes dat ervoor staat. Met het toetsenbord: zet de focus op dat symbool en druk op pijltje omhoog of omlaag. Kolommen kun je niet verplaatsen."
COM_COMPACTTABLES_HELP_LINKS_TITLE="Links in een cel"
COM_COMPACTTABLES_HELP_LINKS_BODY="Selecteer tekst in een cel en klik op de linkknop (het kettinkje) in de balk boven de tabel. Kies Link naar menu-item, Link naar artikel, Link naar webadres, Link naar telefoonnummer of Link naar e-mailadres. Een menu-item of artikel kies je uit een lijst. Bij een webadres kun je aangeven dat de link in een nieuw venster opent. Een telefoonnummer typ je zoals je het gewend bent (met spaties of streepjes mag); wie er op een telefoon op tikt, kan direct bellen. Een e-mailadres wordt een link die het mailprogramma van de bezoeker opent. Is de geselecteerde tekst zelf al een nummer of adres, dan staat het alvast ingevuld. Een link haal je weg door de cursor erin te zetten en op de knop met het doorbroken kettinkje te klikken. Staat de cursor in een link, dan zie je in de balk waar die naartoe gaat."
COM_COMPACTTABLES_HELP_TEMPLATE_TITLE="Template-standaard"
COM_COMPACTTABLES_HELP_TEMPLATE_BODY="Alles wat je leeg laat, volgt je sitetemplate: de tabel ziet er dan uit zoals je template tabellen opmaakt. Het kruisje achter een kleur zet die terug naar de template-standaard."
COM_COMPACTTABLES_HELP_TOPROW_TITLE="Bovenste rij"
COM_COMPACTTABLES_HELP_TOPROW_BODY="Achtergrondkleur, tekstkleur, vetgedrukte tekst, lettergrootte (in px, rem, em of %) en linkkleur van de bovenste rij. Deze instellingen doen alleen iets als ‘Bovenste rij bevat kolomtitels’ aanstaat. Kies je geen linkkleur maar wel een tekstkleur, dan krijgen links in de bovenste rij die tekstkleur. ‘Tekst vetgedrukt’ staat bij een nieuwe tabel op Ja. Templates verschillen hierin: T4 maakt kolomtitels vet, Cassiopeia geeft ze een gewicht van 500 waardoor ze nauwelijks vet lijken. Met Ja of Nee zien ze er op elke template hetzelfde uit."
COM_COMPACTTABLES_HELP_LINES_TITLE="Randen"
COM_COMPACTTABLES_HELP_LINES_BODY="‘Buitenste rand van de tabel’ is de rand om de hele tabel. ‘Verticale lijnen tussen cellen’ staan tussen de kolommen, ‘Horizontale lijnen tussen cellen’ tussen de rijen; je stelt ze apart in, dus je kunt bijvoorbeeld alleen lijnen tussen de rijen tonen. ‘Lijn onder de bovenste rij’ verschijnt alleen als ‘Bovenste rij bevat kolomtitels’ aanstaat, en geeft de rand onder de kolomtitels een eigen dikte en kleur. Elke lijn heeft een dikte in pixels en een kleur. Vul je alleen een dikte in, dan krijgt de lijn de kleur van de tekst; kies je alleen een kleur, dan is de lijn 1 pixel dik. Een dikte van 0 haalt de lijn weg, ook als je template er een toont."
COM_COMPACTTABLES_HELP_SMALL_TITLE="Kleine schermen"
COM_COMPACTTABLES_HELP_SMALL_BODY="Wat er gebeurt als het scherm te smal is voor de tabel. ‘Kolommen behouden’: alle kolommen blijven naast elkaar staan, even breed, en tekst loopt door op de volgende regel. ‘Zijwaarts scrollen’: de tabel houdt zijn breedte en de bezoeker veegt hem opzij. ‘Rijen stapelen’: elke rij wordt een blok, met de kolomtitel vóór elke waarde. Bij veel kolommen lezen de laatste twee op een telefoon meestal het prettigst."
COM_COMPACTTABLES_HELP_PREVIEW_TITLE="Voorbeeld"
COM_COMPACTTABLES_HELP_PREVIEW_BODY="Toont je kleuren, randen, breedte, uitlijning en ruimte tussen de cellen direct. Met Breed en Telefoon zie je hoe de tabel zich gedraagt op een groot en op een klein scherm. Lettertypen, en alles wat op de template-standaard staat, volgen op de website je sitetemplate en kunnen dus afwijken van het voorbeeld."
COM_COMPACTTABLES_HELP_CODE_TITLE="De code in een artikel"
COM_COMPACTTABLES_HELP_CODE_BODY="Typ de code van de tabel, bijvoorbeeld <code>{table 1}</code>, in een artikel op de plek waar de tabel moet komen, het liefst op een eigen regel. Het nummer staat in het overzicht achter elke tabel, met een knop om de code te kopiëren. Dezelfde tabel kun je in meerdere artikelen gebruiken."
COM_COMPACTTABLES_HELP_BUTTON_TITLE="De editorknop"
COM_COMPACTTABLES_HELP_BUTTON_BODY="Bij het bewerken van een artikel hoef je de code niet te typen: gebruik de knop Compact Tabellen en kies de tabel uit de lijst. In TinyMCE staat de knop in het menu CMS Content van de werkbalk, in JCE bij de knoppen onder de editor. Het werkt in het beheer en bij bewerken op de website. Afhankelijk van je rechten kun je in de lijst ook een nieuwe tabel maken, een tabel bewerken (het potloodje) en verwijderen (het vuilnisbakje). Maken en bewerken gebeurt in dezelfde pop-up; na het opslaan sta je weer in de lijst en kun je de tabel kiezen."
COM_COMPACTTABLES_HELP_DELETE_TITLE="Een tabel verwijderen"
COM_COMPACTTABLES_HELP_DELETE_BODY="Het vuilnisbakje in het overzicht verwijdert een tabel definitief, nadat je dat hebt bevestigd. Artikelen waarin de code nog staat, tonen op die plek niets meer."
COM_COMPACTTABLES_HELP_OPTIONS_TITLE="Opties: CSS-class van tabellen"
COM_COMPACTTABLES_HELP_OPTIONS_BODY="Onder Opties stel je de CSS-class in die elke tabel op de website krijgt. Met <code>table</code> passen templates die op Bootstrap zijn gebouwd (zoals Cassiopeia) hun eigen tabelopmaak toe. Je kunt classes toevoegen, bijvoorbeeld <code>table table-striped</code>."
COM_COMPACTTABLES_HELP_PERMISSIONS_TITLE="Rechten"
COM_COMPACTTABLES_HELP_PERMISSIONS_BODY="Op het tabblad Rechten onder Opties bepaal je per gebruikersgroep wie tabellen mag maken (Maken), wijzigen (Bewerken) en verwijderen (Verwijderen). Deze rechten gelden in het beheer en op de website. Met de standaardrechten van Joomla mogen auteurs tabellen maken, redacteuren ze ook wijzigen en managers ze ook verwijderen. De editorknop zelf is in het beheer beschikbaar voor iedereen met toegang tot Compact Tabellen, en op de website voor iedereen die artikelen mag schrijven of bewerken."
COM_COMPACTTABLES_HELP_SAVE_TITLE="Opslaan"
COM_COMPACTTABLES_HELP_SAVE_BODY="Opslaan houdt je op dit scherm, Opslaan &amp; sluiten gaat terug naar het overzicht. Onder het pijltje ernaast: Opslaan &amp; nieuw begint direct een lege tabel, en Opslaan als kopie bewaart de tabel die je open hebt als een nieuwe tabel met een eigen code; het origineel blijft zoals het was. De kopie krijgt een nummer achter de naam, tenzij je de naam eerst zelf aanpast."

