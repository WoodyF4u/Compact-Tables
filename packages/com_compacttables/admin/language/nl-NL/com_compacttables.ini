COM_COMPACTTABLES_CONFIG_TOOLBAR_LABEL="Editorbalk"
COM_COMPACTTABLES_CONFIG_TOOLBAR_DESC="Kies welke knoppen de balk boven de tabel heeft bij het bewerken van een tabel, en in welke volgorde."
COM_COMPACTTABLES_CONFIG_TOOLBAR_FIELD_LABEL="Knoppen van de editorbalk"
COM_COMPACTTABLES_TBCONF_CURRENT="Huidige indeling van de editorbalk"
COM_COMPACTTABLES_TBCONF_AVAILABLE="Beschikbare knoppen"
COM_COMPACTTABLES_TBCONF_HINT="Sleep een knop naar de plek waar je hem wilt hebben, of terug naar de beschikbare knoppen om hem weg te halen. Een klik op een knop verplaatst hem naar de andere lijst. Met het toetsenbord: Enter verplaatst de knop, de pijltjestoetsen links en rechts verschuiven hem. Een dun verticaal streepje in de huidige indeling is een scheidingslijn tussen twee groepen knoppen; met ‘Scheidingslijn’ onder de beschikbare knoppen voeg je er zoveel toe als je wilt."
COM_COMPACTTABLES_TBCONF_RESET="Standaardindeling herstellen"
COM_COMPACTTABLES_HELP_TOOLBAR_TITLE="De editorbalk"
COM_COMPACTTABLES_HELP_TOOLBAR_BODY="De balk boven de tabel maakt de tekst in een cel op: vet, cursief, onderstreept en, als ze zijn aangezet, doorgehaald, subscript en superscript. Zet de cursor in een cel of selecteer tekst en klik op een knop; een knop is gekleurd zolang de tekst bij de cursor die opmaak heeft. De knop met de doorgestreepte T wist de opmaak van de geselecteerde tekst. Houd de muis boven een knop om de naam te zien."
COM_COMPACTTABLES_HELP_TBCONF_TITLE="Opties: Editorbalk"
COM_COMPACTTABLES_HELP_TBCONF_BODY="Op het tabblad Editorbalk onder Opties kies je welke knoppen de editorbalk heeft en in welke volgorde. Sleep knoppen tussen ‘Huidige indeling’ en ‘Beschikbare knoppen’, of klik erop. De indeling geldt voor iedereen die tabellen bewerkt. Standaardindeling herstellen zet de oorspronkelijke balk terug."
COM_COMPACTTABLES_MODAL_NEW="Nieuwe tabel maken"
COM_COMPACTTABLES_MODAL_DELETE_FAILED="De tabel kon niet worden verwijderd."

; Bewerker in de kiezer
COM_COMPACTTABLES_EMBEDDED_NEW="Nieuwe tabel"
COM_COMPACTTABLES_EMBEDDED_EDIT="Tabel bewerken"
COM_COMPACTTABLES_EMBEDDED_SAVE_BACK="Opslaan & terug naar de lijst"
COM_COMPACTTABLES_EMBEDDED_SAVE="Opslaan"
COM_COMPACTTABLES_EMBEDDED_BACK="Terug zonder opslaan"
COM_COMPACTTABLES_TABLE_SUBMIT_SAVE_SUCCESS="Tabel opgeslagen."
COM_COMPACTTABLES_FIELDSET_LAYOUT="Breedte, uitlijning en ruimte"
COM_COMPACTTABLES_FIELD_WIDTH_LABEL="Breedte van de tabel"
COM_COMPACTTABLES_FIELD_WIDTH_DESC="Leeg = de volle breedte. Kies % voor een deel van de beschikbare ruimte, of px voor een vaste maximale breedte. Geldt op brede schermen; op tablets en telefoons gebruikt de tabel altijd de volle breedte."
COM_COMPACTTABLES_FIELD_WIDTH_HINT="Volle breedte"
COM_COMPACTTABLES_FIELD_ALIGN_LABEL="Uitlijning op de pagina"
COM_COMPACTTABLES_FIELD_ALIGN_DESC="Heeft alleen effect als de tabel smaller is dan de volle breedte."
COM_COMPACTTABLES_OPTION_ALIGN_LEFT="Links"
COM_COMPACTTABLES_OPTION_ALIGN_CENTER="Midden"
COM_COMPACTTABLES_OPTION_ALIGN_RIGHT="Rechts"
COM_COMPACTTABLES_HELP_WIDTH_TITLE="Breedte, uitlijning en ruimte"
COM_COMPACTTABLES_HELP_WIDTH_BODY="Standaard gebruikt een tabel de volle breedte van het artikel. Vul bij ‘Breedte van de tabel’ een getal in om hem smaller te maken: in % (een deel van de beschikbare ruimte, bijvoorbeeld 60%) of in px (een vaste maximale breedte, bijvoorbeeld 600px). Een breedte in px wordt nooit breder dan de ruimte die er is. Met ‘Uitlijning op de pagina’ zet je de smallere tabel links, in het midden of rechts. Op tablets en telefoons (schermen tot 768 pixels breed) gebruikt de tabel altijd de volle breedte."
COM_COMPACTTABLES_EDITOR_LINK_TEL="Link naar telefoonnummer"
COM_COMPACTTABLES_EDITOR_LINK_EMAIL="Link naar e-mailadres"
COM_COMPACTTABLES_EDITOR_TEL_LABEL="Telefoonnummer"
COM_COMPACTTABLES_EDITOR_TEL_INVALID="Vul een telefoonnummer in, zoals 020 123 45 67 of +31 6 12345678."
COM_COMPACTTABLES_EDITOR_EMAIL_LABEL="E-mailadres"
COM_COMPACTTABLES_EDITOR_EMAIL_INVALID="Vul een e-mailadres in, zoals naam@voorbeeld.nl."
COM_COMPACTTABLES_FIELDSET_BODY="Overige cellen"
COM_COMPACTTABLES_FIELDSET_BODY_DESC="Alle rijen onder de bovenste rij. Heeft de tabel geen rij met kolomtitels, dan gelden deze instellingen voor alle cellen."
COM_COMPACTTABLES_FIELD_LINK_COLOR_LABEL="Kleur van links"
COM_COMPACTTABLES_HELP_BODY_TITLE="Overige cellen"
COM_COMPACTTABLES_HELP_BODY_BODY="Tekstkleur, vetgedrukte tekst, lettergrootte en linkkleur van alle rijen onder de bovenste rij. Heeft de tabel geen rij met kolomtitels, dan gelden deze instellingen voor alle cellen. Tekst die je in een cel zelf vet hebt gemaakt, blijft vet."
COM_COMPACTTABLES_FIELD_VLINE_WIDTH_LABEL="Verticale lijnen tussen cellen: dikte"
COM_COMPACTTABLES_FIELD_VLINE_COLOR_LABEL="Verticale lijnen tussen cellen: kleur"
COM_COMPACTTABLES_FIELD_HLINE_WIDTH_LABEL="Horizontale lijnen tussen cellen: dikte"
COM_COMPACTTABLES_FIELD_HLINE_COLOR_LABEL="Horizontale lijnen tussen cellen: kleur"
COM_COMPACTTABLES_FIELD_HEAD_LINE_WIDTH_LABEL="Lijn onder de bovenste rij: dikte"
COM_COMPACTTABLES_FIELD_HEAD_LINE_COLOR_LABEL="Lijn onder de bovenste rij: kleur"
COM_COMPACTTABLES_FIELD_SPACING_LABEL="Ruimte tussen de cellen"
COM_COMPACTTABLES_FIELD_SPACING_DESC="Leeg = geen ruimte; de cellen sluiten op elkaar aan. In px, rem of em."
COM_COMPACTTABLES_FIELD_SPACING_HINT="Geen"
COM_COMPACTTABLES_HELP_SPACING_TITLE="Ruimte tussen de cellen"
COM_COMPACTTABLES_HELP_SPACING_BODY="Zet de cellen los van elkaar, met de opgegeven ruimte ertussen (in px, rem of em). Elke cel krijgt dan zijn eigen achtergrond en lijnen; de achtergrond van de pagina is in de tussenruimte te zien. Laat het veld leeg voor een gewone, aaneengesloten tabel."

; Text in the cells
COM_COMPACTTABLES_FIELDSET_CELLS="Tekst in de cellen"
COM_COMPACTTABLES_FIELD_CELL_ALIGN_LABEL="Horizontale uitlijning"
COM_COMPACTTABLES_FIELD_CELL_VALIGN_LABEL="Verticale uitlijning"
COM_COMPACTTABLES_OPTION_VALIGN_TOP="Boven"
COM_COMPACTTABLES_OPTION_VALIGN_MIDDLE="Midden"
COM_COMPACTTABLES_OPTION_VALIGN_BOTTOM="Onder"
COM_COMPACTTABLES_HELP_CELLALIGN_TITLE="Tekst in de cellen"
COM_COMPACTTABLES_HELP_CELLALIGN_BODY="Standaard staat de tekst in elke cel links en bovenaan, ook in de bovenste rij. Bij ‘Horizontale uitlijning’ kies je links, midden of rechts, bij ‘Verticale uitlijning’ boven, midden of onder. Kies ‘Template-standaard’ om het aan je sitetemplate over te laten; Cassiopeia zet de tekst dan bijvoorbeeld verticaal in het midden."

; Linked tables
COM_COMPACTTABLES_FIELDSET_LINK="Koppelen aan andere tabellen"
COM_COMPACTTABLES_FIELD_LINK_GROUP_LABEL="Koppelnaam"
COM_COMPACTTABLES_FIELD_LINK_GROUP_DESC="Geef tabellen die op dezelfde pagina staan dezelfde koppelnaam, bijvoorbeeld ‘bestuur’. Hun kolommen worden dan even breed, zodat ze netjes onder elkaar uitlijnen. Leeg: de tabel staat op zichzelf."
COM_COMPACTTABLES_FIELD_LINK_GROUP_HINT="bijv. bestuur"
COM_COMPACTTABLES_HELP_LINK_TITLE="Tabellen koppelen"
COM_COMPACTTABLES_HELP_LINK_BODY="Staan er meer tabellen onder elkaar op een pagina, dan bepaalt elke tabel zelf hoe breed zijn kolommen zijn, en lijnen ze niet uit. Geef die tabellen op het tabblad Stijl dezelfde ‘Koppelnaam’ (bijvoorbeeld <code>bestuur</code>). Op de website wordt dan per kolom gekeken welke tabel de meeste ruimte nodig heeft, en krijgen alle gekoppelde tabellen precies dezelfde kolombreedtes. Dat werkt voor tabellen met evenveel kolommen. Tabellen die ‘Zijwaarts scrollen’ op kleine schermen houden hun eigen breedtes, en bij ‘Rijen stapelen’ op een telefoon zijn er geen kolommen meer om gelijk te trekken. Het voorbeeld op het tabblad Stijl toont één tabel en dus geen koppeling."
